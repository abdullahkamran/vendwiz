<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Capture the install prompt as early as possible: Chrome can fire
		     beforeinstallprompt before the app hydrates, and a listener added in
		     onMount would miss it. The storefront layout reads window.__installPrompt.
		     The manifest <link> is rendered per-store by the storefront layout. -->
		<script>
			window.addEventListener('beforeinstallprompt', function (e) {
				e.preventDefault();
				window.__installPrompt = e;
				window.dispatchEvent(new Event('vendwiz:installprompt'));
			});
		</script>
		<!-- Google Fonts: all four theme fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
		<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&family=Playfair+Display:wght@400;700;800&family=Raleway:wght@400;600;800&family=Barlow+Condensed:wght@400;700;900&family=Poppins:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
		<!-- No-flash dark-mode: apply stored preference before first paint -->
		<script>
			(function () {
				try {
					if (localStorage.getItem('vendwiz-dark-mode') === 'true') {
						document.documentElement.setAttribute('data-dark', '1');
					}
				} catch (_) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
